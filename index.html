<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Alex+Brush&family=Poppins:wght@300;400;500;600&display=swap');
  :root{
    --ivory:#FDFBFA; --paper:#FFFFFF; --champagne:#F2E6E4; --champagne-soft:#F8EFED;
    --rose:#D9A8A2; --rose-soft:#F3E1DE; --gold:#B98A82; --ink:#2B2622; --ink-soft:#8C8071;
    --rose-deep:#A8645D; --border:#E6D6D2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Poppins',sans-serif;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .display{font-family:'Cormorant Garamond',serif;font-style:italic;}
  .script{font-family:'Alex Brush',cursive;font-style:normal;line-height:1;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--paper);color:var(--ink);width:100%;}
  input[type="checkbox"]{accent-color:var(--gold);width:auto;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
  .pill{border-radius:999px;}
  .btn{background:var(--gold);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{opacity:.9;}
  .btn-outline{background:var(--paper);color:var(--ink-soft);border:1px solid var(--border);padding:8px 16px;border-radius:999px;font-size:13px;}
  .btn-outline:hover{border-color:var(--gold);}
  .card{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:20px;}
  .muted{color:var(--ink-soft);}
  .gold{color:var(--gold);}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--rose-soft);color:var(--rose-deep);border-radius:999px;padding:3px 10px;font-size:11px;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin-bottom:6px;}
  #header{background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  #header .row{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  #brand{flex-shrink:0;}
  #brand{display:flex;align-items:center;gap:10px;}
  #brand .name{line-height:1;}
  #brand .sub{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-soft);}
  .nav-toggle{width:100%;text-align:left;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--ink);}
  .nav-toggle:hover{border-color:var(--gold);}
  #nav-panel{position:absolute;left:0;right:0;top:44px;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:6px;z-index:30;box-shadow:0 8px 24px rgba(43,38,34,.12);max-height:70vh;overflow-y:auto;}
  .maps-choice-panel{position:absolute;top:100%;left:0;margin-top:6px;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:4px;z-index:40;box-shadow:0 8px 24px rgba(43,38,34,.12);white-space:nowrap;}
  .maps-choice-panel a{display:block;padding:8px 14px;font-size:13px;color:var(--ink);text-decoration:none;border-radius:6px;}
  .maps-choice-panel a:hover{background:var(--champagne-soft);color:var(--gold);}
  .nav-item{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:13px;color:var(--ink-soft);}
  .nav-item:hover{background:var(--champagne-soft);}
  .nav-item.active{background:var(--ink);color:#fff;}
  #nav button{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--ink-soft);}
  #nav button.active{background:var(--ink);color:#fff;}
  #nav button:hover:not(.active){background:var(--champagne-soft);}
  #main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
  .grid2{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:700px){.grid2{grid-template-columns:1fr 1fr;}}
  .grid3{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:700px){.grid3{grid-template-columns:1fr 1fr;}}
  @media(min-width:1000px){.grid3{grid-template-columns:1fr 1fr 1fr;}}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--champagne-soft);text-transform:uppercase;font-size:10px;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:9px 8px;font-weight:500;}
  td{padding:6px 8px;border-top:1px solid var(--border);}
  tr:nth-child(even) td{background:var(--ivory);}
  .row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .tabbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0;}
  .tabbar button{padding:8px 14px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--ink-soft);background:var(--paper);}
  .tabbar button.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0 0;}
  .stat{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;}
  .stat .val{font-size:32px;}
  .stat:hover{border-color:var(--gold);transform:translateY(-1px);}
  .clickcard{cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;text-align:left;}
  .clickcard:hover{border-color:var(--gold);transform:translateY(-1px);}
  .quicktile{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;width:100%;}
  .quicktile:hover{border-color:var(--gold);transform:translateY(-1px);}
  .quicktile .emoji{font-size:22px;}
  .quicktile .label{font-size:11px;color:var(--ink);}
  .quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(min-width:600px){.quickgrid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:900px){.quickgrid{grid-template-columns:repeat(7,1fr);}}
  .stat .icon{background:var(--champagne-soft);border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);font-size:14px;}
  .stat .val{font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1;}
  .stat .lbl{font-size:10px;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}
  .progressbar{height:8px;border-radius:999px;background:var(--champagne-soft);overflow:hidden;}
  .progressbar .fill{height:100%;background:var(--gold);}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  @media(max-width:560px){
    .hero-row{flex-direction:column;text-align:center;}
    .hero-row .eyebrow{text-align:center;}
    .hero-countdown{justify-content:center;width:100%;margin-top:12px;}
  }
  .icon-btn{color:var(--ink-soft);padding:4px;}
  .icon-btn:hover{color:var(--gold);}
  .icon-btn.danger:hover{color:var(--rose-deep);}
  .listrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;}
  .listrow input,.listrow select{font-size:12px;padding:5px 8px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:5px;}
  .timegroup{display:flex;gap:12px;}
  .timegroup .time{width:48px;flex-shrink:0;font-size:12px;color:var(--gold);padding-top:10px;font-weight:500;}
  .timegroup .events{flex:1;border-left:1px solid var(--border);padding-left:12px;padding-bottom:12px;}
  .eventcard{background:var(--ivory);border-radius:10px;padding:8px 12px;margin-bottom:6px;}
  .eventcard .title{font-size:13px;}
  .tl-group{display:flex;gap:12px;}
  .tl-time{width:52px;flex-shrink:0;font-size:12px;color:var(--gold);font-weight:600;padding-top:11px;text-align:right;}
  .tl-line{border-left:2px solid var(--border);padding-left:16px;flex:1;padding-bottom:14px;}
  .tl-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;width:100%;}
  .tl-card:last-child{margin-bottom:0;}
  .tl-card .title{font-size:13px;color:var(--ink);}
  .table-round{position:relative;width:100%;max-width:280px;aspect-ratio:1/1;margin:0 auto;}
  .seat{position:absolute;transform:translate(-50%,-50%);}
  .seat-chip{width:100%;aspect-ratio:1/1;border-radius:999px;background:var(--rose-soft);color:var(--rose-deep);border:1px solid rgba(184,116,110,.35);display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;line-height:1.1;padding:2px;cursor:grab;}
  .seat-empty{width:100%;aspect-ratio:1/1;border-radius:999px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:9px;}
  .table-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;height:44%;border-radius:999px;background:var(--champagne-soft);border:1px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%;}
  .pool{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .pool.dragover, .table-card.dragover, .room-card.dragover{border-color:var(--gold);box-shadow:0 0 0 3px rgba(191,160,89,.15);}
  .pool-chip{display:flex;align-items:center;gap:6px;background:var(--champagne-soft);border-radius:999px;padding:6px 10px;font-size:12px;margin-bottom:6px;cursor:grab;}
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  #gate .box{background:var(--paper);border:1px solid var(--border);border-radius:24px;padding:32px;max-width:360px;width:100%;text-align:center;}
  #search-panel{position:absolute;right:0;top:44px;width:320px;max-width:85vw;background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 8px 24px rgba(58,50,41,.14);z-index:30;}
  .search-result{display:flex;justify-content:space-between;gap:8px;padding:8px;border-radius:8px;text-align:left;width:100%;}
  .search-result:hover{background:var(--champagne-soft);}
  .readonly-banner{background:var(--champagne-soft);text-align:center;padding:5px;font-size:11px;color:var(--ink-soft);}
  .fade{animation:fadein .25s ease-out;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .mono{width:44px;height:44px;flex-shrink:0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;font-size:12px;font-family:'Poppins',sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .selected-guest{box-shadow:0 0 0 2px var(--gold) !important;}
  .guest-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:820px){.guest-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1300px){.guest-grid{grid-template-columns:repeat(3,1fr);}}
  .guest-mcard{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .guest-mcard .mrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .guest-mcard label.mlbl{font-size:10px;color:var(--ink-soft);display:block;margin-bottom:2px;}
  @media print{
    #header,.pool,.readonly-banner,footer,.btn,.quickgrid,#search-panel{display:none !important;}
    body{background:#fff;}
    .card{border:1px solid #ccc;break-inside:avoid;}
    #main{padding:0;max-width:100%;}
  }
</style>
</head>

/* ============ HELPERS ============ */
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function parseEventTitle(titre) {
  var range = null;
  var m = titre.match(/\s*\(([\dhH:’'\s]+-[\dhH:’'\s]+)\)\s*$/);
  if (m) { range = m[1].trim(); titre = titre.slice(0, m.index).trim(); }
  return { titre: titre, range: range };
}
function wazeUrl(place) {
  return "https://waze.com/ul?q=" + encodeURIComponent(place) + "&navigate=yes";
}
function googleMapsUrl(place) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place);
}
function mapsLink(place, label) {
  return '<span style="position:relative;display:inline-block;">'+
    '<button onclick="toggleMapChoice(event,this)" data-place="'+esc(place)+'" style="all:unset;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:var(--border);">'+esc(label||place)+'</button>'+
  '</span>';
}
function toggleMapChoice(e, btn) {
  e.stopPropagation();
  var existing = document.querySelector('.maps-choice-panel');
  var wasThisOne = existing && existing.parentElement === btn.parentElement;
  if (existing) { existing.remove(); document.removeEventListener('click', closeMapChoice); if (wasThisOne) return; }
  var place = btn.getAttribute('data-place');
  var panel = document.createElement('div');
  panel.className = 'maps-choice-panel';
  panel.innerHTML =
    '<a href="'+wazeUrl(place)+'" target="_blank" rel="noopener noreferrer">Ouvrir dans Waze</a>'+
    '<a href="'+googleMapsUrl(place)+'" target="_blank" rel="noopener noreferrer">Ouvrir dans Google Maps</a>';
  btn.parentElement.appendChild(panel);
  setTimeout(function(){ document.addEventListener('click', closeMapChoice); }, 0);
}
function closeMapChoice(ev) {
  var panel = document.querySelector('.maps-choice-panel');
  if (panel && !panel.contains(ev.target)) { panel.remove(); document.removeEventListener('click', closeMapChoice); }
}
function uid(arr) { return arr.reduce(function(m,x){ return Math.max(m, x.id||0); }, 0) + 1; }
function timeToMinutes(t) {
  if (!t) return 0;
  var m = /(\d{1,2})h(\d{2})/.exec(t);
  if (!m) return 0;
  var h = parseInt(m[1],10), min = parseInt(m[2],10);
  if (h < 6) h += 24;
  return h*60+min;
}
function groupByHeure(events) {
  var out = [];
  events.forEach(function(e){
    var last = out[out.length-1];
    if (last && last.heure === e.heure) last.events.push(e);
    else out.push({ heure: e.heure, events: [e] });
  });
  return out;
}
function save(key, value) {
  if (!CAN_EDIT) return;
  STATE[key] = value;
  api.set(key, value);
  showToast('✓ Enregistré');

function showToast(msg) {
  var el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.className = 'toast'; }, 1600);
}

function loadAndStart() {
  api.getAll().then(function(remote){
    Object.keys(SEEDS).forEach(function(k){
      if (remote[k] !== undefined) {
        STATE[k] = remote[k];
      } else {
        STATE[k] = SEEDS[k];
        api.set(k, STATE[k]); // first-time init
      }
    });
    if (STATE.trousse && STATE.trousse.guestItems === undefined) {
      STATE.trousse = Object.assign({}, STATE.trousse, {guestItems: [
        {id:1,nom:"Doliprane / Paracétamol",coche:false},
        {id:2,nom:"Pansements",coche:false},
        {id:3,nom:"Coton",coche:false},
        {id:4,nom:"Désinfectant",coche:false},
        {id:5,nom:"Épingles à nourrice",coche:false},
        {id:6,nom:"Mouchoirs",coche:false}
      ]});
      api.set('trousse', STATE.trousse);
    }
    GATE_NEEDED = !!(STATE.access && STATE.access.passcode);
    if (GATE_NEEDED) {
      var sess = sessionStorage.getItem("wedding_session");
      if (sess) {
        try {
          var parsed = JSON.parse(sess);
          CAN_EDIT = !!parsed.canEdit;
          renderApp();
          return;
        } catch(e) {}
      }
      renderGate();
    } else {
      CAN_EDIT = true;
      renderApp();
    }
  }).catch(function(){
    document.getElementById("app").innerHTML =
      '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--ivory);">'+
        monogramSvg(56) +
        '<div class="display" style="font-size:20px;">Connexion impossible</div>'+
        '<p class="muted" style="font-size:13px;max-width:280px;">Vérifie ta connexion internet, puis réessaie.</p>'+
        '<button class="btn" onclick="location.reload()">Réessayer</button>'+
      '</div>';
  });
}

function tryUnlock(pin) {
  var access = STATE.access;
  var canEdit = null;
  if (pin === access.passcode) canEdit = true;
  else if (access.readonlyPasscode && pin === access.readonlyPasscode) canEdit = false;
  if (canEdit === null) {
    document.getElementById("gate-error").style.display = "block";
    return;
  }
  CAN_EDIT = canEdit;
  sessionStorage.setItem("wedding_session", JSON.stringify({ canEdit: canEdit }));
  renderApp();
}

function highlightMatch(text, q) {
  var t = String(text);
  if (!q) return esc(t);
  var idx = t.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return esc(t);
  return esc(t.slice(0,idx)) + '<mark style="background:var(--rose-soft);color:var(--rose-deep);padding:0 1px;border-radius:2px;">' + esc(t.slice(idx, idx+q.length)) + '</mark>' + esc(t.slice(idx+q.length));
}
function doSearch(q) {
  q = q.trim().toLowerCase();
  var out = [];
  if (q) {
    STATE.guests.forEach(function(g){ if (g.nom.toLowerCase().indexOf(q)>=0) out.push({type:"Invité",label:g.nom,sub:g.table?"Table "+g.table:"",tab:"guests"}); });
    STATE.vendors.forEach(function(v){ if ((v.nom+" "+v.categorie).toLowerCase().indexOf(q)>=0) out.push({type:"Prestataire",label:v.nom||v.categorie,sub:v.categorie,tab:"vendors"}); });
    STATE.animations.forEach(function(a){ if (a.nom.toLowerCase().indexOf(q)>=0) out.push({type:"Animation",label:a.nom,sub:a.heure,tab:"animations"}); });
    STATE.tables.forEach(function(t){
      if (t.nom.toLowerCase().indexOf(q)>=0) out.push({type:"Table",label:t.nom,sub:t.occupants.length+" invités",tab:"tables"});
      t.occupants.forEach(function(o){ if (o.label.toLowerCase().indexOf(q)>=0) out.push({type:"Table",label:o.label,sub:t.nom,tab:"tables"}); });
    });
    STATE.rooms.forEach(function(r){
      if (r.nom.toLowerCase().indexOf(q)>=0) out.push({type:"Chambre",label:r.nom,sub:r.occupants.length+" pers.",tab:"rooms"});
      r.occupants.forEach(function(o){ if (o.label.toLowerCase().indexOf(q)>=0) out.push({type:"Chambre",label:o.label,sub:r.nom,tab:"rooms"}); });
    });
    STATE.planning.forEach(function(e){ if (e.titre.toLowerCase().indexOf(q)>=0) out.push({type:"Planning",label:parseEventTitle(e.titre).titre,sub:e.jour+" "+e.heure,tab:"planning"}); });
    STATE.ceremony.forEach(function(s){ if (s.etape.toLowerCase().indexOf(q)>=0) out.push({type:"Cérémonie",label:s.etape,sub:s.debut,tab:"ceremony"}); });
  }
  out = out.slice(0,20);
  document.getElementById("search-results").innerHTML = out.map(function(r){
    return '<button class="search-result" onclick="go(\''+r.tab+'\');toggleSearch();"><div><div style="font-size:13px;">'+highlightMatch(r.label,q)+'</div><div class="muted" style="font-size:10px;">'+esc(r.sub||'')+'</div></div><span class="gold" style="font-size:10px;">'+r.type+'</span></button>';
  }).join('') || (q ? '<p class="muted" style="font-size:12px;text-align:center;padding:10px;">Aucun résultat.</p>' : '');
}

function myMissionsHtml(person){
  var missions = [].concat(STATE.honneur.demoiselles.missions||[], STATE.honneur.temoins.missions||[])
    .filter(function(m){ return m.responsable===person; });
  var html = '';
  if(missions.length){
    html += '<div style="margin-top:14px;"><div class="eyebrow" style="margin-bottom:6px;">Mission(s)</div>'+
      missions.map(function(m){
        return '<div class="tl-card"><div class="title">'+esc(m.titre)+'</div>'+(m.notes?'<div class="muted" style="font-size:12px;margin-top:4px;">'+esc(m.notes)+'</div>':'')+'</div>';
      }).join('') + '</div>';
  }
  var any=false;
  var scheduleHtml='';
  DAY_ORDER.forEach(function(d){
    var evs = STATE.planning.filter(function(e){ return e.jour===d && e.personnes.indexOf(person)>=0; })
      .sort(function(a,b){ return timeToMinutes(a.heure)-timeToMinutes(b.heure); });
    if(!evs.length) return;
    any=true;
    scheduleHtml += '<div class="gold" style="display:flex;align-items:center;gap:10px;font-size:11px;text-transform:uppercase;margin:14px 0 6px;"><span style="flex:1;height:1px;background:var(--border);"></span><span>'+d+'</span><span style="flex:1;height:1px;background:var(--border);"></span></div>';
    scheduleHtml += timelineHtml(groupByHeure(evs));
  });
  if(any){
    html += '<div style="margin-top:6px;"><div class="eyebrow">Planning de '+esc(person)+'</div>'+scheduleHtml+'</div>';
  } else if(!missions.length){
    html += '<p class="muted" style="font-size:12px;margin-top:14px;">Rien de prévu pour '+esc(person)+' pour le moment.</p>';
  }
  return html;
}

var GUEST_CATEGORIES = ["Famille Nathaelle","Famille Jérémy","Amis Nathaelle","Amis Jérémy","Travail Nathaelle","Travail Jérémy"];
var PRESENCE_STYLE = {
  confirme: { bg:"#E4EFE3", c:"#5C8A5A" },

  absent: { bg:"#F3E3E1", c:"#B15E56" }

function updateGuest(id, field, value){ save('guests', STATE.guests.map(function(g){ if(g.id!==id) return g; return withField(g, field, value); })); }
function updateGuestVinHonneur(id, checked){
  if (!CAN_EDIT) return;
  var nextGuests = STATE.guests.map(function(g){
    if(g.id!==id) return g;
    var next = withField(g,'vinHonneur',checked);
    if(checked){ next = withField(next,'hebergement',false); next = withField(next,'brunch',false); }
    return next;
  });
  STATE.guests = nextGuests;
  api.set('guests', nextGuests);
  if(checked){
    var nextTables = STATE.tables.map(function(t){ return Object.assign({},t,{occupants:t.occupants.filter(function(o){return o.guestId!==id;})}); });
    var nextRooms = STATE.rooms.map(function(r){ return Object.assign({},r,{occupants:r.occupants.filter(function(o){return o.guestId!==id;})}); });
    STATE.tables = nextTables;
    STATE.rooms = nextRooms;
    api.set('tables', nextTables);
    api.set('rooms', nextRooms);
  }
  showToast('✓ Enregistré');
  render();
}

var PRESENCE_ORDER = { confirme:0, attente:1, absent:2 };
function setGuestsSortKey(v){ UI.guestsSortKey=v; render(); }
function cmpGuests(a,b,key){
  if(key==='presence'){ return PRESENCE_ORDER[a.presence]-PRESENCE_ORDER[b.presence]; }
  var av=(a[key]||'').toString().toLowerCase();
  var bv=(b[key]||'').toString().toLowerCase();
  if(key==='groupe'){ if(!av&&bv) return 1; if(av&&!bv) return -1; }
  if(av<bv) return -1;
  if(av>bv) return 1;
  return 0;
}
function viewGuests(){
  var html = '<div class="fade"><div class="flex-between"><h2 class="display" style="font-size:28px;">Invités</h2>'+
    (CAN_EDIT?'<button class="btn" onclick="addGuest()">+ Ajouter un invité</button>':'')+
  '</div>';

  var search=(UI.guestsSearch||'').toLowerCase();
  var filter=UI.guestsFilter||'tous';
  var sortKey=UI.guestsSortKey||'nom';
  var filtered = STATE.guests.filter(function(g){
    if(search && g.nom.toLowerCase().indexOf(search)<0) return false;
    if(filter==='confirme'&&g.presence!=='confirme') return false;
    if(filter==='attente'&&g.presence!=='attente') return false;
    if(filter==='absent'&&g.presence!=='absent') return false;
    if(filter==='heberges'&&!g.hebergement) return false;
    if(filter==='vin'&&!g.vinHonneur) return false;
    return true;
  }).slice().sort(function(a,b){ return cmpGuests(a,b,sortKey); });
  var filters=[['tous','Tous'],['confirme','Confirmés'],['attente','En attente'],['absent','Absents'],['heberges','Hébergés'],['vin',"Vin d'honneur"]];
  var sortOptions=[['nom','Nom'],['presence','Présence'],['groupe','Catégorie']];
  html += '<p class="muted" style="font-size:12px;margin-top:-6px;">'+filtered.length+'/'+STATE.guests.length+' affichés — regroupés par catégorie</p>';
  html += '<div class="row-flex" style="margin:12px 0;">'+
    '<input id="guests-search" placeholder="Rechercher..." style="max-width:240px;border-radius:999px;" value="'+esc(UI.guestsSearch||'')+'" oninput="setGuestsSearch(this.value)"/>'+
    filters.map(function(f){return '<button class="btn-outline" style="'+(filter===f[0]?'background:var(--ink);color:#fff;border-color:var(--ink);':'')+'" onclick="setGuestsFilter(\''+f[0]+'\')">'+f[1]+'</button>';}).join('')+
    '<select onchange="setGuestsSortKey(this.value)" style="max-width:170px;border-radius:999px;margin-left:auto;">'+
      sortOptions.map(function(s){return '<option value="'+s[0]+'" '+(sortKey===s[0]?'selected':'')+'>Trier par '+s[1]+'</option>';}).join('')+
    '</select>'+
  '</div>';

  var groupOrder = GUEST_CATEGORIES.concat(['']);
  var byGroup = {};
  filtered.forEach(function(g){
    var k = groupOrder.indexOf(g.groupe||'')>=0 ? (g.groupe||'') : '';
    (byGroup[k]=byGroup[k]||[]).push(g);
  });
  html += '<div class="guest-grid">';
  groupOrder.forEach(function(cat){
    var members = byGroup[cat];
    if(!members || !members.length) return;
    html += '<div class="card" style="grid-column:1/-1;">'+
      '<div class="eyebrow" style="margin-bottom:10px;">'+(cat?esc(cat):'Non classés')+' <span class="muted" style="text-transform:none;font-size:11px;">('+members.length+')</span></div>'+
      '<div class="guest-grid">'+ members.map(guestCardMobile).join('') +'</div>'+
    '</div>';
  });
  html += '</div></div>';
  return html;
}

function viewPlanning(){
  var people=Array.from(new Set(STATE.planning.reduce(function(a,e){return a.concat(e.personnes);},[]))).sort();
  var person = UI.planningPerson && people.indexOf(UI.planningPerson)>=0 ? UI.planningPerson : "Tout le monde";
  var onlyMajor = person === "Tout le monde";

  if(!UI.planningDay) UI.planningDay = "Samedi";
  var day = UI.planningDay;

  var html='<div class="fade"><div class="flex-between">'+
    '<div><h2 class="display" style="font-size:28px;margin:0;">Planning</h2><p class="muted" style="font-size:12px;margin-top:2px;">'+(onlyMajor?"Déroulé de la journée":"Planning détaillé de "+esc(person))+'</p></div>'+
    '<button class="btn-outline" onclick="window.print()">🖨️ Imprimer</button>'+
  '</div>';

  html+='<select style="max-width:280px;border-radius:999px;margin-top:12px;" onchange="setPlanningPerson(this.value)">'+
    '<option '+(person==="Tout le monde"?'selected':'')+'>Tout le monde</option>'+
    people.map(function(p){return '<option '+(p===person?'selected':'')+'>'+esc(p)+'</option>';}).join('')+
  '</select>';

  var GENERAL_DAYS = ["Vendredi","Samedi","Dimanche"];
  var dayOptions = onlyMajor ? GENERAL_DAYS : DAY_ORDER;
  if(onlyMajor && dayOptions.indexOf(day)<0) day = "Samedi";
  html+='<div class="tabbar">'+dayOptions.map(function(d){return '<button class="'+(day===d?'active':'')+'" onclick="setPlanningDay(\''+d+'\')">'+d+'</button>';}).join('')+'</div>';

  var evs = STATE.planning.filter(function(e){
    if(e.jour!==day) return false;
    if(onlyMajor) return e.important;
    return e.personnes.indexOf(person)>=0;
  }).sort(function(a,b){return timeToMinutes(a.heure)-timeToMinutes(b.heure);});
  var groups = groupByHeure(evs);

  html+='<div class="card">';
  if(!evs.length){
    html+='<p class="muted" style="text-align:center;padding:24px;font-size:13px;">'+(onlyMajor?'Rien de prévu pour ce jour.':'Rien de prévu pour '+esc(person)+' ce jour-là.')+'</p>';
  } else {
    html += timelineHtml(groups);
  }
  if(CAN_EDIT){
    html+='<div class="row-flex" style="margin-top:14px;flex-wrap:wrap;">'+
      '<input id="add-ev-heure" placeholder="Heure" style="width:80px;"/>'+
      '<input id="add-ev-titre" placeholder="Titre" style="flex:1;min-width:140px;"/>'+
      '<input id="add-ev-lieu" placeholder="Lieu (optionnel, GPS)" style="flex:1;min-width:160px;"/>'+
      '<button class="btn" onclick="addPlanningEvent(\''+esc(person).replace(/\047/g,"\\'")+'\')">+ Ajouter'+(onlyMajor?'':' pour '+esc(person))+'</button>'+
    '</div>';
  }
  html+='</div>';
  return html+'</div>';
}

/* ============ TABLES (plan de table, rond, drag&drop) ============ */
function removeFromAllTables(arr,guestId,label){ return arr.map(function(t){ return Object.assign({},t,{occupants:t.occupants.filter(function(o){return guestId?o.guestId!==guestId:o.label!==label;})}); }); }
function onDragStartGuest(e,guestId,label){ DRAG={guestId:guestId,label:label}; e.dataTransfer.setData('text/plain','x'); }
function onDragStartOccupant(e,guestId,label){ DRAG={guestId:guestId||null,label:label}; e.dataTransfer.setData('text/plain','x'); }
function onDropTable(e,tableId){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  if(!DRAG) return;
  var target=STATE.tables.find(function(t){return t.id===tableId;});
  if(!target||target.occupants.length>=target.capacity){DRAG=null;return;}
  var next=removeFromAllTables(STATE.tables,DRAG.guestId,DRAG.label);
  next=next.map(function(t){return t.id===tableId?Object.assign({},t,{occupants:t.occupants.concat([{guestId:DRAG.guestId||null,label:DRAG.label}])}):t;});
  save('tables', next);
  DRAG=null;
}
function onDropPoolTables(e){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  if(!DRAG) return;
  save('tables', removeFromAllTables(STATE.tables,DRAG.guestId,DRAG.label));
  DRAG=null;
}
function renameTable(id,nom){ save('tables', STATE.tables.map(function(t){return t.id===id?Object.assign({},t,{nom:nom}):t;})); }
function tableCapacity(id,delta){ save('tables', STATE.tables.map(function(t){ if(t.id!==id) return t; return Object.assign({},t,{capacity:Math.max(t.occupants.length,t.capacity+delta)}); })); }
function deleteTable(id){ if(!confirm('Supprimer cette table ?')) return; save('tables', STATE.tables.filter(function(t){return t.id!==id;})); }
function addTable(){ var id=uid(STATE.tables); save('tables', STATE.tables.concat([{id:id,nom:'Nouvelle table',forme:'ronde',capacity:10,occupants:[]}])); }
function removeTableOccupant(tableId, idx){ save('tables', STATE.tables.map(function(t){ if(t.id!==tableId) return t; var occ=t.occupants.slice(); occ.splice(idx,1); return Object.assign({},t,{occupants:occ}); })); }
function tableCardHtml(t){
  var filled=t.occupants.length, cap=t.capacity;
  var seatCount=Math.max(cap,filled);
  var angleStep=360/(seatCount||1), radius=41;
  var seatSize= seatCount<=8?26:seatCount<=10?23:seatCount<=12?20:17;
  var seatsHtml='';
  for(var i=0;i<seatCount;i++){
    var angle=(angleStep*i-90)*Math.PI/180;
    var x=50+radius*Math.cos(angle), y=50+radius*Math.sin(angle);
    var occ=t.occupants[i];
    seatsHtml+='<div class="seat" style="left:'+x+'%;top:'+y+'%;width:'+seatSize+'%;">';
    if(occ){
      var gid = occ.guestId===null||occ.guestId===undefined?'null':occ.guestId;
      var glabel = esc(occ.label).replace(/\047/g,"\\'");
      var sel = isSelected(occ.guestId||null, occ.label);
      seatsHtml+='<div class="seat-chip'+(sel?' selected-guest':'')+'" '+(CAN_EDIT?'draggable="true" ondragstart="onDragStartOccupant(event,'+gid+',\''+glabel+'\')" onclick="selectGuestForDrag(event,'+gid+',\''+glabel+'\')"':'')+' title="'+esc(occ.label)+'">'+esc(occ.label)+
        (CAN_EDIT?'<span onclick="event.stopPropagation();removeTableOccupant('+t.id+','+i+')" style="position:absolute;top:-4px;right:-4px;background:#fff;border-radius:999px;width:13px;height:13px;font-size:9px;line-height:13px;text-align:center;border:1px solid var(--border);cursor:pointer;">✕</span>':'')+
      '</div>';
    } else {
      seatsHtml+='<div class="seat-empty">·</div>';
    }
    seatsHtml+='</div>';
  }
  var over=filled>cap, full=filled===cap&&cap>0;
  var badgeColor= over?'#B15E56':full?'#5C8A5A':'#BFA059';
  var badgeBg= over?'#F3E3E1':full?'#E4EFE3':'#F6EFE0';
  return '<div class="table-card card" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="onDropTable(event,'+t.id+')" onclick="onDropTable(event,'+t.id+')">'+
    '<div class="table-round" style="position:relative;">'+seatsHtml+
      '<div class="table-center" onclick="event.stopPropagation()">'+
        (CAN_EDIT? '<input value="'+esc(t.nom)+'" onchange="renameTable('+t.id+',this.value)" style="border:none;background:transparent;text-align:center;font-family:\'Cormorant Garamond\',serif;font-style:italic;padding:0;font-size:13px;"/>' : '<div class="display" style="font-size:13px;">'+esc(t.nom)+'</div>')+
        '<span class="chip" style="background:'+badgeBg+';color:'+badgeColor+';margin-top:4px;">'+filled+'/'+cap+'</span>'+
        (CAN_EDIT?'<div class="row-flex" style="margin-top:6px;"><button class="btn-outline" style="padding:2px 8px;" onclick="tableCapacity('+t.id+',-1)">–</button><button class="btn-outline" style="padding:2px 8px;" onclick="tableCapacity('+t.id+',1)">+</button></div>':'')+
      '</div>'+
    '</div>'+
    (CAN_EDIT?'<div style="text-align:center;margin-top:8px;" onclick="event.stopPropagation()"><button class="icon-btn danger" style="font-size:11px;" onclick="deleteTable('+t.id+')">🗑 Supprimer</button></div>':'')+
  '</div>';
}
function viewTables(){
  var placedKeys={};
  STATE.tables.forEach(function(t){ t.occupants.forEach(function(o){ placedKeys[o.guestId?('g'+o.guestId):('l'+o.label)]=true; }); });
  var search=(UI.tablesSearch||'').toLowerCase();
  var unplaced=STATE.guests.filter(function(g){ return !g.vinHonneur && !placedKeys['g'+g.id] && (!search||g.nom.toLowerCase().indexOf(search)>=0); });

  var totalOcc=STATE.tables.reduce(function(s,t){return s+t.occupants.length;},0);

    '<div class="row-flex">'+(CAN_EDIT?'<button class="btn" onclick="addTable()">+ Ajouter une table</button>':'')+'<button class="btn-outline" onclick="window.print()">🖨️ Imprimer</button></div>'+
  '</div>'+
  (DRAG?'<p class="muted" style="font-size:12px;margin:6px 0;"><b>'+esc(DRAG.label)+'</b> sélectionné — touchez une table pour le placer, ou touchez-le à nouveau pour annuler.</p>':(CAN_EDIT?'<p class="muted" style="font-size:11px;margin:6px 0;">Astuce mobile : touchez un invité pour le sélectionner, puis touchez une table.</p>':''))+
  '<div class="grid2" style="margin-top:14px;align-items:start;">'+
    '<div class="grid2">'+ STATE.tables.map(tableCardHtml).join('') +'</div>'+
    '<div class="pool" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="onDropPoolTables(event)" onclick="onDropPoolTables(event)">'+
      '<b style="font-size:13px;">Non placés ('+unplaced.length+')</b>'+
      '<input id="tables-search" placeholder="Rechercher..." style="border-radius:999px;margin:8px 0;" value="'+esc(UI.tablesSearch||'')+'" oninput="UI.tablesSearch=this.value;render();" onclick="event.stopPropagation()"/>'+
      unplaced.map(function(g){var gl=esc(g.nom).replace(/\047/g,"\\'"); var sel=isSelected(g.id,g.nom); return '<div class="pool-chip'+(sel?' selected-guest':'')+'" draggable="true" ondragstart="onDragStartGuest(event,'+g.id+',\''+gl+'\')" onclick="selectGuestForDrag(event,'+g.id+',\''+gl+'\')">'+esc(g.nom)+'</div>';}).join('') +
      (unplaced.length===0?'<p class="muted" style="font-size:12px;">Tout le monde est placé.</p>':'')+
    '</div>'+

/* ============ ROOMS (chambres, drag&drop) ============ */
function removeFromAllRooms(arr,guestId,label){ return arr.map(function(r){ return Object.assign({},r,{occupants:r.occupants.filter(function(o){return guestId?o.guestId!==guestId:o.label!==label;})}); }); }
function onDropRoom(e,roomId){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  if(!DRAG) return;
  var target=STATE.rooms.find(function(r){return r.id===roomId;});
  if(!target||target.occupants.length>=target.capacity){DRAG=null;return;}
  var next=removeFromAllRooms(STATE.rooms,DRAG.guestId,DRAG.label);
  next=next.map(function(r){ return r.id===roomId?Object.assign({},r,{occupants:r.occupants.concat([{guestId:DRAG.guestId||null,label:DRAG.label}])}):r; });
  save('rooms', next);
  DRAG=null;
}
function onDropPoolRooms(e){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  if(!DRAG) return;
  save('rooms', removeFromAllRooms(STATE.rooms,DRAG.guestId,DRAG.label));
  DRAG=null;
}
function renameRoom(id,nom){ save('rooms', STATE.rooms.map(function(r){return r.id===id?Object.assign({},r,{nom:nom}):r;})); }
function roomCapacity(id,delta){ save('rooms', STATE.rooms.map(function(r){ if(r.id!==id) return r; return Object.assign({},r,{capacity:Math.max(r.occupants.length,r.capacity+delta)}); })); }
function deleteRoom(id){ if(!confirm('Supprimer cette chambre ?')) return; save('rooms', STATE.rooms.filter(function(r){return r.id!==id;})); }
function addRoom(){ var id=uid(STATE.rooms); save('rooms', STATE.rooms.concat([{id:id,nom:'Nouvelle chambre',capacity:4,occupants:[]}])); }
function removeRoomOccupant(roomId, idx){ save('rooms', STATE.rooms.map(function(r){ if(r.id!==roomId) return r; var occ=r.occupants.slice(); occ.splice(idx,1); return Object.assign({},r,{occupants:occ}); })); }
function roomCardHtml(r){
  var filled=r.occupants.length, cap=r.capacity;
  var over=filled>cap, full=filled===cap&&cap>0;
  var badgeColor= over?'#B15E56':full?'#5C8A5A':'#BFA059';
  var badgeBg= over?'#F3E3E1':full?'#E4EFE3':'#F6EFE0';
  return '<div class="room-card card" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="onDropRoom(event,'+r.id+')" onclick="onDropRoom(event,'+r.id+')">'+
    '<div class="flex-between" onclick="event.stopPropagation()">'+
      (CAN_EDIT?'<input value="'+esc(r.nom)+'" onchange="renameRoom('+r.id+',this.value)" style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:16px;border:none;flex:1;padding:0;"/>':'<div class="display" style="font-size:16px;">'+esc(r.nom)+'</div>')+
      (CAN_EDIT?'<button class="icon-btn danger" onclick="deleteRoom('+r.id+')">🗑</button>':'')+
    '</div>'+
    '<div class="row-flex" style="margin:8px 0;" onclick="event.stopPropagation()">'+
      '<span class="chip" style="background:'+badgeBg+';color:'+badgeColor+';">'+filled+'/'+cap+' places</span>'+
      (CAN_EDIT?'<div class="row-flex" style="margin-left:auto;"><button class="btn-outline" style="padding:2px 8px;" onclick="roomCapacity('+r.id+',-1)">–</button><button class="btn-outline" style="padding:2px 8px;" onclick="roomCapacity('+r.id+',1)">+</button></div>':'')+
    '</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;min-height:32px;">'+
      r.occupants.map(function(o,idx){
        var gid = o.guestId===null||o.guestId===undefined?'null':o.guestId;
        var glabel = esc(o.label).replace(/\047/g,"\\'");
        var sel = isSelected(o.guestId||null, o.label);
        return '<div class="pool-chip'+(sel?' selected-guest':'')+'" draggable="'+(CAN_EDIT?'true':'false')+'" ondragstart="onDragStartOccupant(event,'+gid+',\''+glabel+'\')" onclick="selectGuestForDrag(event,'+gid+',\''+glabel+'\')">'+esc(o.label)+(CAN_EDIT?' <span onclick="event.stopPropagation();removeRoomOccupant('+r.id+','+idx+')" style="margin-left:4px;cursor:pointer;">✕</span>':'')+'</div>';
      }).join('') +
      (r.occupants.length===0?'<span class="muted" style="font-size:12px;">Glissez des invités ici</span>':'')+
    '</div>'+
  '</div>';
}
function viewRooms(){
  var placedKeys={};
  STATE.rooms.forEach(function(r){ r.occupants.forEach(function(o){ placedKeys[o.guestId?('g'+o.guestId):('l'+o.label)]=true; }); });
  var search=(UI.roomsSearch||'').toLowerCase();
  var unplaced=STATE.guests.filter(function(g){ return !g.vinHonneur && !placedKeys['g'+g.id] && (!search||g.nom.toLowerCase().indexOf(search)>=0); });
  var totalCap=STATE.rooms.reduce(function(s,r){return s+r.capacity;},0);
  var totalOcc=STATE.rooms.reduce(function(s,r){return s+r.occupants.length;},0);
  return '<div class="fade"><div class="flex-between"><div><h2 class="display" style="font-size:28px;">Chambres</h2><p class="muted" style="font-size:12px;">'+totalOcc+' / '+totalCap+' places occupées</p></div>'+
    '<div class="row-flex">'+(CAN_EDIT?'<button class="btn" onclick="addRoom()">+ Ajouter une chambre</button>':'')+'<button class="btn-outline" onclick="window.print()">🖨️ Imprimer</button></div>'+
  '</div>'+
  (DRAG?'<p class="muted" style="font-size:12px;margin:6px 0;"><b>'+esc(DRAG.label)+'</b> sélectionné — touchez une chambre pour le placer, ou touchez-le à nouveau pour annuler.</p>':(CAN_EDIT?'<p class="muted" style="font-size:11px;margin:6px 0;">Astuce mobile : touchez un invité pour le sélectionner, puis touchez une chambre.</p>':''))+
  '<div class="grid2" style="margin-top:14px;align-items:start;">'+
    '<div class="grid2">'+ STATE.rooms.map(roomCardHtml).join('') +'</div>'+
    '<div class="pool" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="onDropPoolRooms(event)" onclick="onDropPoolRooms(event)">'+
      '<b style="font-size:13px;">Non hébergés ('+unplaced.length+')</b>'+
      '<input id="rooms-search" placeholder="Rechercher..." style="border-radius:999px;margin:8px 0;" value="'+esc(UI.roomsSearch||'')+'" oninput="UI.roomsSearch=this.value;render();" onclick="event.stopPropagation()"/>'+
      unplaced.map(function(g){var gl=esc(g.nom).replace(/\047/g,"\\'"); var sel=isSelected(g.id,g.nom); return '<div class="pool-chip'+(sel?' selected-guest':'')+'" draggable="true" ondragstart="onDragStartGuest(event,'+g.id+',\''+gl+'\')" onclick="selectGuestForDrag(event,'+g.id+',\''+gl+'\')">'+esc(g.nom)+'</div>';}).join('') +
      (unplaced.length===0?'<p class="muted" style="font-size:12px;">Tout le monde est placé.</p>':'')+
    '</div>'+
  '</div></div>';
}

/* ============ DOCUMENTS ============ */
var DOC_CATS=["Contrats","Devis","Factures","Plans","Château","Traiteur","DJ","Cérémonie","Autres"];
function saveDocEdit(id){
  var patch={nom:val('dc-nom'),categorie:val('dc-cat'),lien:val('dc-lien'),notes:val('dc-notes')};
  save('documents', STATE.documents.map(function(d){return d.id===id?Object.assign({},d,patch):d;}));
  clearEditing();
}
function deleteDoc(id){ save('documents', STATE.documents.filter(function(d){return d.id!==id;})); }
function addDoc(){
  var nom=val('add-dc-nom');
  if(!nom.trim()) return;
  var id=uid(STATE.documents);
  save('documents', STATE.documents.concat([{id:id,nom:nom,categorie:val('add-dc-cat')||'Autres',lien:val('add-dc-lien'),notes:''}]));
  UI.addingDoc=false;
}
function docRowHtml(d){
  if(EDITING.type==='doc'&&EDITING.id===d.id){
    return '<div class="listrow" style="flex-direction:column;align-items:stretch;"><input id="dc-nom" value="'+esc(d.nom)+'" placeholder="Nom"/><div class="row-flex" style="margin-top:6px;"><select id="dc-cat">'+DOC_CATS.map(function(c){return '<option '+(d.categorie===c?'selected':'')+'>'+c+'</option>';}).join('')+'</select><input id="dc-lien" value="'+esc(d.lien)+'" placeholder="Lien" style="flex:1;"/></div><input id="dc-notes" value="'+esc(d.notes)+'" placeholder="Notes" style="margin-top:6px;"/><div class="row-flex" style="justify-content:flex-end;margin-top:6px;"><button class="btn" onclick="saveDocEdit('+d.id+')">✓</button><button class="btn-outline" onclick="clearEditing()">✕</button></div></div>';
  }
  return '<div class="listrow"><span>📄</span><div style="flex:1;"><div style="font-size:13px;">'+(d.nom?esc(d.nom):'<span class="muted">Sans nom</span>')+'</div><div class="muted" style="font-size:10px;">'+esc(d.categorie)+(d.notes?' · '+esc(d.notes):'')+'</div></div>'+
    (d.lien?'<a class="chip" href="'+esc(d.lien)+'" target="_blank" style="background:var(--champagne-soft);color:var(--gold);">↗ Ouvrir</a>':'')+
    (CAN_EDIT?'<button class="icon-btn" onclick="setEditing(\'doc\','+d.id+')">✎</button><button class="icon-btn danger" onclick="deleteDoc('+d.id+')">🗑</button>':'')+
  '</div>';
}
function viewDocuments(){
  var search=(UI.docSearch||'').toLowerCase();
  var filtered=STATE.documents.filter(function(d){return !search||d.nom.toLowerCase().indexOf(search)>=0||d.categorie.toLowerCase().indexOf(search)>=0;});
  var html='<div class="fade"><div class="flex-between"><h2 class="display" style="font-size:28px;">Documents</h2>'+(CAN_EDIT?'<button class="btn" onclick="UI.addingDoc=true;render();">+ Ajouter</button>':'')+'</div>'+
  '<input id="documents-search" placeholder="Rechercher un document..." style="border-radius:999px;margin:12px 0;" value="'+esc(UI.docSearch||'')+'" oninput="UI.docSearch=this.value;render();"/>'+
  '<div>'+filtered.map(docRowHtml).join('');
  if(UI.addingDoc){
    html+='<div class="listrow" style="flex-direction:column;align-items:stretch;"><input id="add-dc-nom" placeholder="Nom du document"/><div class="row-flex" style="margin-top:6px;"><select id="add-dc-cat">'+DOC_CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select><input id="add-dc-lien" placeholder="Lien" style="flex:1;"/></div><div class="row-flex" style="justify-content:flex-end;margin-top:6px;"><button class="btn" onclick="addDoc()">✓</button><button class="btn-outline" onclick="UI.addingDoc=false;render();">✕</button></div></div>';
  }
  if(!filtered.length && !UI.addingDoc) html+='<p class="muted" style="text-align:center;padding:20px;">Aucun document.</p>';
  return html+'</div></div>';
}

/* ============ ADMIN ============ */
function saveAccessField(field,value){ save('access', withField(STATE.access,field,value)); }
function viewAdmin(){
  var a=STATE.access;
  return '<div class="fade"><h2 class="display" style="font-size:28px;">Administration</h2>'+
  '<div class="card" style="max-width:420px;margin-top:12px;"><div class="eyebrow">🔒 Code complet (modification)</div>'+
  '<p class="muted" style="font-size:12px;">'+(a.passcode?'Ce code donne un accès complet. Ne le partage qu\'avec les personnes autorisées.':'Aucun code défini : tout le monde peut modifier le site.')+'</p>'+
  '<div class="row-flex"><input id="admin-pass" value="'+esc(a.passcode)+'" placeholder="Code d\'accès"/><button class="btn" onclick="saveAccessField(\'passcode\',val(\'admin-pass\'))">✓</button></div>'+
  '</div>'+
  '<div class="card" style="max-width:420px;margin-top:12px;"><div class="eyebrow">Code lecture seule</div>'+
  '<p class="muted" style="font-size:12px;">'+(a.readonlyPasscode?'Ce second code permet de consulter sans modifier.':'Pas encore de code lecture seule.')+'</p>'+
  '<div class="row-flex"><input id="admin-pass-ro" value="'+esc(a.readonlyPasscode)+'" placeholder="Code lecture seule"/><button class="btn" onclick="saveAccessField(\'readonlyPasscode\',val(\'admin-pass-ro\'))">✓</button></div>'+
  '</div>'+
  '<p class="muted" style="font-size:11px;max-width:420px;margin-top:10px;">Ces deux codes sont partagés (pas de comptes individuels) : quiconque connaît le code complet peut aussi les modifier ici.</p>'+
  '</div>';
}


document.addEventListener('click', function(e){
  var navPanel = document.getElementById('nav-panel');
  var navToggle = document.querySelector('.nav-toggle');
  if (navPanel && navPanel.style.display === 'block') {
    if (!navPanel.contains(e.target) && (!navToggle || !navToggle.contains(e.target))) {
      navPanel.style.display = 'none';
    }
  }
  var searchPanel = document.getElementById('search-panel');
  var searchToggle = document.querySelector('button[onclick="toggleSearch()"]');
  if (searchPanel && searchPanel.style.display === 'block') {
    if (!searchPanel.contains(e.target) && (!searchToggle || !searchToggle.contains(e.target))) {
      searchPanel.style.display = 'none';
    }
  }
});
var ENTER_TO_VALIDATE_IDS = ['ev-edit-heure','ev-edit-titre','ev-edit-lieu','add-ev-heure','add-ev-titre','add-ev-lieu',
  'cer-debut','cer-fin','cer-duree','cer-etape','cer-musique','add-cer-debut','add-cer-fin','add-cer-duree','add-cer-etape',
  'an-nom','an-heure','an-resp','an-lieu','an-pers','an-mat','an-mus',
  'add-an-nom','add-an-heure','add-an-resp','add-an-lieu',
  'vd-cat','vd-nom','vd-tel','vd-email','add-vd-cat','add-vd-nom',
  'add-trousse-item','add-guest-trousse-item'];
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var t = e.target;
  if (!t || t.tagName !== 'INPUT') return;
  var id = t.id || '';
  var ok = ENTER_TO_VALIDATE_IDS.indexOf(id) >= 0 || id.indexOf('add-mission-titre-')===0 || id.indexOf('add-mission-resp-')===0;
  if (!ok) return;
  var el = t;
  while (el && el !== document.body) {
    var btn = el.querySelector('button.btn');
    if (btn) { e.preventDefault(); btn.click(); return; }
    el = el.parentElement;
  }
});
document.addEventListener("DOMContentLoaded", loadAndStart);
setInterval(function(){ if (CURRENT_TAB === "dashboard") render(); }, 60000);
</script>
